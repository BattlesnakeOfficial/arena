[package]
name = "rules"
version.workspace = true
license = "MIT"
edition.workspace = true

[dependencies]
rand = "0.8"
# Explicit dependency for royale hazard placement: ChaCha8Rng is documented
# as a portable, reproducible stream, unlike rand's StdRng.
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
proptest = "1"
