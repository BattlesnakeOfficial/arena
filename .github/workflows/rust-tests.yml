name: Rust Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cja frontend tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/cja
          key: cja-tools-${{ runner.os }}-tsc-7.0.2

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: command -v sqlx || cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arena_test

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arena_test
        run: |
          set +e
          cargo test -p arena --bin arena --no-run || exit 1
          fails=0
          red() {
            echo "=================== RED $1 on $2"
            env "$1=1" cargo test -p arena --bin arena -- "$2"
            code=$?
            echo "RESULT red $1 $2 exit=$code"
            [ "$code" -eq 101 ] || fails=$((fails+1))
          }
          red RED_PRUNE_A prune_respects_batch_and_run_caps
          red RED_PRUNE_B prune_respects_batch_and_run_caps
          red RED_ROT_KEEP_OLD web_login_rotates_session_and_reissues_cookie
          red RED_ROT_NO_COOKIE web_login_rotates_session_and_reissues_cookie
          red RED_LOGOUT_FLASH logout_failure_logs_and_shows_no_success_flash
          red RED_CLAIM_TWO_STEP email_claim_failure_rolls_back_token_so_link_survives
          echo "=================== CONTROL no env"
          cargo test -p arena --bin arena -- prune_respects_batch_and_run_caps web_login_rotates_session_and_reissues_cookie logout_failure_logs_and_shows_no_success_flash logout_success_writes_flash email_claim_failure_rolls_back_token_so_link_survives
          code=$?
          echo "RESULT control exit=$code"
          [ "$code" -eq 0 ] || fails=$((fails+1))
          echo "RESULT unexpected_outcomes=$fails"
          exit "$fails"
