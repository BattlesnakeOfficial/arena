# Platform CI for the battlesnake CLI (DEV-2144): `cargo test -p battlesnake`
# on Windows and macOS, so platform breakage shows up before the release task
# (DEV-2149). The CLI's dependency tree never compiles the server's
# sqlx::query! macros, so no Postgres service is needed.
name: CLI Platform Tests

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "engine-core/**"
      - "rules/**"
      - "arena-api-scope/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/cli-platform-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "engine-core/**"
      - "rules/**"
      - "arena-api-scope/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/cli-platform-tests.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test -p battlesnake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Surface every OS's results: a macOS failure must not cancel the
      # Windows job (or vice versa) — one cancelled matrix leg hides the
      # evidence this job exists to produce.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cli-test-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test -p battlesnake
        # --no-fail-fast: a failing lib test must not stop the run before
        # the integration-test binaries (play_cli, play_review_pins, …)
        # have executed — their results are part of the platform evidence.
        run: cargo test -p battlesnake --no-fail-fast

  # DEV-2306: the release's licence gate, at PR time. Mirrors the notices
  # job in cli-release.yml (same config, same --fail) so an unaccepted
  # licence in a new dependency fails here first.
  licence-notices:
    name: cargo about (licence gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cli-notices-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-about
        run: cargo install --locked --version 0.9.3 --features cli cargo-about

      - name: Generate third-party licence notices (must satisfy cli/about.toml)
        run: |
          cargo about generate --locked --fail \
            -m cli/Cargo.toml \
            -o "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md" \
            cli/about.hbs
          test -s "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
