# Platform CI for the battlesnake CLI (DEV-2144): `cargo test -p battlesnake`
# on Windows and macOS, so platform breakage shows up before the release task
# (DEV-2149). The CLI's dependency tree never compiles the server's
# sqlx::query! macros, so no Postgres service is needed.
name: CLI Platform Tests

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "engine-core/**"
      - "rules/**"
      - "arena-api-scope/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/cli-platform-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "engine-core/**"
      - "rules/**"
      - "arena-api-scope/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/cli-platform-tests.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test -p battlesnake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Surface every OS's results: a macOS failure must not cancel the
      # Windows job (or vice versa) — one cancelled matrix leg hides the
      # evidence this job exists to produce.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cli-test-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test -p battlesnake
        # --no-fail-fast: a failing lib test must not stop the run before
        # the integration-test binaries (play_cli, play_review_pins, …)
        # have executed — their results are part of the platform evidence.
        run: cargo test -p battlesnake --no-fail-fast
