[package]
name = "arena"
version = "0.1.0"
edition = "2024"

default-run = "arena"

build = "build.rs"

[dependencies]
tokio = { version = "1.21", features = ["full"] }
color-eyre = "0.6.2"

opentelemetry = { version = "0.22.0" }
opentelemetry_sdk = { version = "0.22.0", features = ["rt-tokio"] }
tracing = "0.1.37"
tracing-opentelemetry = "0.23.0"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
tracing-tree = "0.3.0"
# Same version cja uses; needed directly to wire the Eyes layer into the
# GCP logging path (cja's setup_tracing only wires it in the non-GCP path).
eyes-subscriber = "0.8.1"
opentelemetry-otlp = { version = "0.15.0", features = [
  "http-proto",
  "reqwest-rustls",
  "reqwest-client",
], default-features = false }
sentry = { version = "0.32.2", default-features = false, features = [
  "rustls",
  "backtrace",
  "contexts",
  "panic",
  "tower",
  "reqwest",
] }
sentry-tower = { version = "0.32.2", features = ["http"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
maud = { version = "0.27.0", features = ["axum"] }
async-trait = "0.1.60"
axum = { version = "0.8", features = ["ws"] }
axum-macros = "0.4.0"
tower-http = { version = "0.5.2", features = ["trace", "cors"] }
tower = "0.4.13"
reqwest = { version = "0.12.12", features = [
  "json",
  "rustls-tls",
  "multipart",
], default-features = false }

cja = { version = "0.0.0", git = "https://github.com/coreyja/cja", branch = "main" }
sqlx = "0.8"
uuid = { version = "1.6.1", features = ["v4"] }
time = "0.3.9"
futures = "0.3.30"
chrono = { version = "0.4.23", default-features = false, features = ["serde", "clock"] }
base64 = "0.21"
base64ct = { version = "1.6", features = ["alloc"] }
ring = "0.17"
rand = "0.8"
sha2 = "0.10"
pbkdf2 = "0.12"
subtle = "2"
tempfile = "3.8"
urlencoding = "2.1"
url = "2"
simple_asn1 = "0.6"
num-bigint = "0.4"
include_dir = "0.7.4"
mime_guess = "2.0.5"
google-cloud-storage = "0.22"
zstd = "0.13"
thiserror = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
toml = "0.8"
open = "5"
hostname = "0.4"

# CLI human-readable output
is-terminal = "0.4"
tabled = "0.17"
colored = "2"
chrono-humanize = "0.2"

skillratings = "0.28"
rules = { path = "../rules" }
tokio-util = { version = "0.7.14", features = ["rt"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# design_kit (DEV-1539): PNG/JPEG/SVG upload -> one clean head/tail path. Pure Rust.
# Rasteriser for lint metrics; no png-format (PNG decoding uses `png` directly).
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
# Tracing engine behind vtracer 0.6.x binary mode.
visioncortex = "0.8.10"
png = "0.18.1"
# Pinned: design_kit::raster_in mirrors 0.5.15 internals (`first_scan_components` walks
# markers like its header parser; `buffers_coefficients` and `buffered_max_pixels` copy
# when and how much it buffers). Re-check those, and the JPEG memory caps, before bumping.
zune-jpeg = "=0.5.15"
# SVG input: parsing and normalising to paths. No text/fonts, no svgz, no writer. Its
# image resolvers are replaced with no-ops (the defaults read local files). resvg is
# deliberately NOT a runtime dependency: it renders filters and mask layers, which are
# memory and CPU bombs on untrusted input (see docs/design-kit.md).
#
# PINNED EXACTLY, with simplecss below: the SVG prescan (src/design_kit/svg_scan.rs)
# mirrors usvg 0.48.1's reference following, simplecss's selector matching and
# roxmltree's tokenizer, and a reference loop it misses aborts the whole process (a stack
# overflow can't be caught). Bumping any of usvg, simplecss, roxmltree or svgtypes means
# re-checking svg_scan.rs against the new sources;
# `svg_parsing_crates_are_the_audited_versions` (tests/design_kit_svg.rs) fails until the
# versions there are updated too.
usvg = { version = "=0.48.1", default-features = false }
# The CSS engine usvg uses (the same copy): the SVG prescan matches selectors exactly as
# usvg will, to find references made from stylesheets and to bound the matching cost.
simplecss = "=0.2.2"

[lib]
name = "arena"
path = "src/lib.rs"

[[bin]]
name = "arena"
path = "src/main.rs"

[[bin]]
name = "arena-cli"
path = "src/bin/arena-cli.rs"

[[bin]]
name = "stress-test"
path = "src/bin/stress_test.rs"

[build-dependencies]
vergen = { version = "8.3.1", features = [
  "build",
  "cargo",
  "git",
  "gitoxide",
  "rustc",
] }

[dev-dependencies]
tower = { version = "0.4.13", features = ["util"] }
proptest = "1"
wiremock = "0.6"
tower-cookies = { version = "0.11", features = ["private"] }
# design_kit tests: independent SVG renderer (test oracle only, never at runtime)
# and a JPEG encoder for JPEG round-trip fixtures.
resvg = { version = "=0.48.1", default-features = false }
jpeg-encoder = "0.7.1"
