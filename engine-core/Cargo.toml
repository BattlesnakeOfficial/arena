[package]
name = "engine-core"
version.workspace = true
license = "MIT"
edition.workspace = true

[dependencies]
rules = { path = "../rules" }
rand = "0.8"
# The crate defines the RNG a seed produces (seeded_game); rand_chacha is
# already in the tree through `rules`, so this grows no new deps.
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6.1", features = ["v4"] }
color-eyre = "0.6.2"
# Shared HTTP-boundary helpers (http_util) sit on reqwest's response
# streaming. No features needed for `Response::chunk`; TLS comes from the
# CLI/server declarations via feature unification.
reqwest = { version = "0.12", default-features = false }
url = "2"

[dev-dependencies]
proptest = "1"
